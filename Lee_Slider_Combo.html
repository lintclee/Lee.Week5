<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <title>ARRRGH!</title>
    </head>
<body>

    <input id = "gain" type="range" min="0" max="1" step="0.01" value="0.2"><label id="gainDisplay">Gain1</label>
    <input id = "pitch" type="range" min ="1" max = "12" value="1"><label id = "pitchDisplay">Pitch1</label>
    <input id = "gain2" type="range" min="0" max = "1" step="0.01" value="0.1"><label id="gainDisplay2">Gain2</label>
    <input id = "pitch2" type="range" min ="0.5" max = "7.5" value="0.5" step="0.5"><label id = "pitchDisplay2">Pitch2</label>
    <input id = "gain3" type="range" min="0" max="0.5" step="0.01" value="0"><label id="gainDisplay3">Gain3</label>
    <input id = "pitch3" type="range" min ="110" max = "880" value="110" step="55"><label id = "pitchDisplay3">Pitch3</label>
    <script>
        const ctx = new AudioContext();
        ctx.suspend();

        const osc = new OscillatorNode(ctx);
        const osc2 = new OscillatorNode(ctx);
        const osc3 = new OscillatorNode(ctx);
        const osc4 = new OscillatorNode(ctx);
        const gain = new GainNode(ctx);
        gain.gain.value = 0.2;

        const osc5 = new OscillatorNode(ctx);
        const osc6 = new OscillatorNode(ctx);
        const osc7 = new OscillatorNode(ctx);
        const gain2 = new GainNode(ctx);
        gain2.gain.value=0.2;

        const osc8 = new OscillatorNode(ctx);
        const gain3 = new GainNode(ctx);
        gain3.gain.value=0.1;


        osc.connect(gain);
        osc2.connect(gain);
        osc3.connect(gain);
        osc4.connect(gain);
        osc5.connect(gain2);
        osc6.connect(gain2);
        osc7.connect(gain2);
        osc8.connect(gain3);
        gain.connect(ctx.destination);
        gain2.connect(ctx.destination);
        gain3.connect(ctx.destination);
        osc.start();
        osc2.start();
        osc3.start();
        osc4.start();
        osc5.start();
        osc6.start();
        osc7.start();
        osc8.start();


        osc5.type = "sawtooth"
        osc6.type = "sawtooth"
        osc7.type = "sawtooth"

        osc8.type = "square"

        
        const slider1 = document.querySelector("#gain");
        slider1.addEventListener("input", () => {
            ctx.resume();
        gain.gain.value = Number(slider1.value);
        });

        const slider2 = document.querySelector("#pitch");
        slider2.addEventListener("input", () => {
        ctx.resume();
        osc.frequency.value =  110 * Number(slider2.value);
        osc2.frequency.value = 165 * Number(slider2.value);
        osc3.frequency.value = 275 * Number(slider2.value);
        osc4.frequency.value = 221 * Number(slider2.value);
        });

        const slider3 = document.querySelector("#gain2");
        slider3.addEventListener("input", () => {
            ctx.resume();
        gain2.gain.value = Number(slider3.value);
        });
   
    const slider4 = document.querySelector("#pitch2");
        slider4.addEventListener("input", () => {
        ctx.resume();
        osc5.frequency.value = 165 * Number(slider4.value);
        osc6.frequency.value = 330 * Number(slider4.value);
        osc7.frequency.value = 329 * Number(slider4.value);
        });

        const slider5 = document.querySelector("#gain3");
        slider5.addEventListener("input", () => {
        ctx.resume();
        gain3.gain.value = Number(slider5.value);
        });

        const slider6 = document.querySelector("#pitch3");
        slider6.addEventListener("input", () => {
        ctx.resume();
        osc8.frequency.value = Number(slider6.value);
        });

    </script>

    </body>
    </html>
