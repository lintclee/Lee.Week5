<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <title>ARRRGH!</title>
    </head>
<body>

    <input id = "gain" type="range" min="0" max="1" step="0.01" value="0.2"><label id="gainDisplay">Gain1</label>
    <input id = "pitch" type="range" min ="1" max = "12" value="1"><label id = "pitchDisplay">Pitch1</label>
    <input id = "gain2" type="range" min="0" max = "1" step="0.01" value="0"><label id="gainDisplay2">Gain2</label>
    <input id = "pitch2" type="range" min ="0.5" max = "6" value="0.5" step="0.5"><label id = "pitchDisplay2">Pitch2</label>
    <script>
        const ctx = new AudioContext();
        ctx.suspend();

        const osc = new OscillatorNode(ctx);
        const osc2 = new OscillatorNode(ctx);
        const osc3 = new OscillatorNode(ctx);
        const osc4 = new OscillatorNode(ctx);
        const gain = new GainNode(ctx);
        gain.gain.value = 0.2;

        osc.connect(gain);
        osc2.connect(gain);
        osc3.connect(gain);
        osc4.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc2.start();
        osc3.start();
        osc4.start();

        const slider1 = document.querySelector("#gain");
        slider1.addEventListener("input", () => {
            ctx.resume();
        gain.gain.value = Number(slider1.value);
        document.querySelector("gainDisplay").textContent = slider1.value;
    });


        const slider2 = document.querySelector("#pitch");
        slider2.addEventListener("input", () => {
        ctx.resume();
        osc.frequency.value =  110 * Number(slider2.value);
        osc2.frequency.value = 165 * Number(slider2.value);
        osc3.frequency.value = 275 * Number(slider2.value);
        osc4.frequency.value = 221 * Number(slider2.value);
        document.querySelector("#pitchDisplay").textContent = slider2.value;
        });

        const osc5 = new OscillatorNode(ctx);
        const gain2 = new GainNode(ctx);
        gain2.gain.value=0

        osc5.connect(gain2);
        gain2.connect(ctx.destination);
        osc5.start;

        const slider3 = document.querySelector("#gain2");
        slider3.addEventListener("input", () => {
            ctx.resume();
        gain2.gain.value = Number(slider1.value);
        document.querySelector("#gainDisplay2").textContent = slider1.value;
    });
   
    const slider4 = document.querySelector("#pitch2");
        slider4.addEventListener("input", () => {
        ctx.resume();
        osc5.frequency.value =  110 * Number(slider2.value);
        document.querySelector("#pitchDisplay2").textContent = slider2.value;
        });

    </script>

    </body>
    </html>
